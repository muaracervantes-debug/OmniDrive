name: Build Windows preview
on:
  workflow_dispatch:
  push:
    branches:
      - feat/dark-file-manager-ui
    paths:
      - 'src/OmniDrive.App/**'
      - 'src/OmniDrive.Core/**'
      - 'src/OmniDrive.Application/**'
      - 'src/OmniDrive.Providers.Telegram/**'
      - 'tests/**'
      - 'OmniDrive.slnx'
      - 'global.json'
      - '.github/workflows/windows-preview.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore OmniDrive.slnx
      - name: Run automated tests
        run: dotnet test OmniDrive.slnx -c Release --no-restore
      - name: Publish self-contained Windows executable
        run: dotnet publish src/OmniDrive.App/OmniDrive.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/OmniDrive-win-x64
      - name: Remove non-runtime and unused architecture files
        shell: pwsh
        run: |
          $publishDir = "artifacts/OmniDrive-win-x64"
          Get-ChildItem $publishDir -Recurse -File -Include *.pdb,*.lib | Remove-Item -Force
          @("libvlc/win-x86", "libvlc/win-arm64") | ForEach-Object {
            $unusedArchitecture = Join-Path $publishDir $_
            if (Test-Path $unusedArchitecture) {
              Remove-Item $unusedArchitecture -Recurse -Force
            }
          }
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: OmniDrive-Windows-x64
          path: artifacts/OmniDrive-win-x64/
          if-no-files-found: error
          retention-days: 14
